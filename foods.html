<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#42977d">
<title>음식 관리</title>
<link rel="stylesheet" href="css/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9440982975556344" crossorigin="anonymous"></script>
</head>
<body>
<main class="app">
  <header class="top">
    <h1 class="top-title">음식 관리</h1>
    <p class="top-sub">음식과 100g당 칼로리를 저장하면 칼로리 체크에서 검색돼요</p>
  </header>

  <section class="card" aria-label="음식 추가">
    <h2 class="card-title">음식 추가</h2>
    <div class="food-form">
      <input type="text" id="ffName" class="text-input ff-name" placeholder="음식 이름" maxlength="30">
      <div class="ff-row">
        <input type="number" id="ffCal" class="text-input ff-cal" placeholder="kcal/100g" inputmode="numeric" min="0">
        <input type="text" id="ffCat" class="text-input ff-cat" placeholder="분류 (선택)" maxlength="20">
      </div>
    </div>
    <p class="form-hint">※ 칼로리는 100g 기준 평균값으로 입력하세요 (예: 흰쌀밥 130)</p>
    <button id="foodAddBtn" type="button" class="btn-primary btn-block" style="margin-top:14px;">＋ 음식 추가</button>
  </section>

  <section class="card list-card">
    <div class="card-head">
      <h2 class="card-title" id="foodCount">등록된 음식</h2>
    </div>
    <ul id="manageList" class="manage-list"></ul>
  </section>

  <aside class="ad-card" aria-label="광고">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-9440982975556344"
         data-ad-slot="5846209263"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </aside>
</main>

<nav class="tab-bar" aria-label="메뉴">
  <a href="index.html" class="tab-item"><span class="tab-icon">🏠</span>홈</a>
  <a href="calendar.html" class="tab-item"><span class="tab-icon">📅</span>달력</a>
  <a href="search.html" class="tab-item"><span class="tab-icon">🔎</span>칼로리 체크</a>
  <a href="foods.html" class="tab-item active"><span class="tab-icon">🍚</span>음식 관리</a>
</nav>

<script src="js/foodStore.js"></script>
<script src="js/foods.js"></script>
</body>
</html>
