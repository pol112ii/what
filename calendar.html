<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#42977d">
<title>달력</title>
<link rel="stylesheet" href="css/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9440982975556344" crossorigin="anonymous"></script>
</head>
<body>
<main class="app">
  <header class="top">
    <h1 class="top-title">성취 달력</h1>
    <p class="top-sub">목표를 지킨 날은 O, 초과한 날은 X로 표시돼요</p>
  </header>

  <section class="card cal-card">
    <div class="cal-head">
      <button class="cal-nav" id="prevMonth" type="button" aria-label="이전 달">‹</button>
      <span class="cal-title" id="calTitle">2026년 6월</span>
      <button class="cal-nav" id="nextMonth" type="button" aria-label="다음 달">›</button>
    </div>

    <div class="cal-grid" id="calDow">
      <div class="cal-dow sun">일</div>
      <div class="cal-dow">월</div>
      <div class="cal-dow">화</div>
      <div class="cal-dow">수</div>
      <div class="cal-dow">목</div>
      <div class="cal-dow">금</div>
      <div class="cal-dow sat">토</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>

    <div class="cal-legend">
      <span><span class="dot ok">O</span> 목표 달성</span>
      <span><span class="dot no">X</span> 목표 초과</span>
    </div>
  </section>

  <section class="card">
    <h2 class="card-title" id="calMonthLabel">이번 달 성취</h2>
    <div class="cal-summary">
      <div class="cal-stat">
        <div class="num ok" id="statSuccess">0</div>
        <div class="lbl">달성</div>
      </div>
      <div class="cal-stat">
        <div class="num no" id="statFail">0</div>
        <div class="lbl">초과</div>
      </div>
      <div class="cal-stat">
        <div class="num" id="statRate">0%</div>
        <div class="lbl">달성률</div>
      </div>
    </div>
  </section>

  <aside class="ad-card" aria-label="광고">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-9440982975556344"
         data-ad-slot="5846209263"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </aside>
</main>

<nav class="tab-bar" aria-label="메뉴">
  <a href="index.html" class="tab-item"><span class="tab-icon">🏠</span>홈</a>
  <a href="calendar.html" class="tab-item active"><span class="tab-icon">📅</span>달력</a>
  <a href="search.html" class="tab-item"><span class="tab-icon">🔎</span>칼로리 체크</a>
  <a href="foods.html" class="tab-item"><span class="tab-icon">🍚</span>음식 관리</a>
</nav>

<script src="js/store.js"></script>
<script src="js/calendar.js"></script>
</body>
</html>
