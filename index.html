<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f6">
<title>오늘의 칼로리</title>
<link rel="stylesheet" href="css/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9440982975556344" crossorigin="anonymous"></script>
</head>
<body>
<main class="app">
  <header class="top">
    <p class="top-date" id="today">날짜</p>
    <h1 class="top-title">오늘의 칼로리</h1>
  </header>

  <!-- 남은 칼로리 + 게이지 -->
  <section class="card hero" id="remainingBox" aria-live="polite">
    <p class="hero-label" id="remainingLabel">남은 칼로리</p>
    <div class="hero-number">
      <span id="remaining">2000</span>
      <span class="hero-unit">kcal</span>
    </div>
    <div class="gauge" role="progressbar" aria-label="칼로리 진행률">
      <div class="gauge-fill" id="barFill"></div>
    </div>
    <div class="gauge-meta">
      <span class="pct" id="gaugePercent">0%</span>
      <span id="eatenSummary">먹은 칼로리 0 kcal</span>
    </div>
  </section>

  <!-- 목표 칼로리 -->
  <section class="card goal-card" aria-label="목표 칼로리 설정">
    <span class="goal-label">하루 목표</span>
    <span class="goal-input-wrap">
      <input type="number" id="goal" value="2000" min="0" inputmode="numeric" aria-label="목표 칼로리">
      <span class="unit">kcal</span>
    </span>
  </section>

  <!-- 직접 추가 -->
  <section class="card" aria-label="칼로리 직접 추가">
    <h2 class="card-title">직접 추가</h2>
    <div class="input-row">
      <input type="text" id="nameInput" class="text-input" placeholder="음식 이름 (선택)" maxlength="20">
      <input type="number" id="calInput" class="text-input" placeholder="kcal" inputmode="numeric" min="0" aria-label="먹은 칼로리">
      <button id="addBtn" type="button" class="btn-primary">추가</button>
    </div>
    <div class="quick-add" aria-label="빠른 추가">
      <button type="button" data-cal="100">+100</button>
      <button type="button" data-cal="200">+200</button>
      <button type="button" data-cal="300">+300</button>
      <button type="button" data-cal="500">+500</button>
    </div>
  </section>

  <!-- 오늘 먹은 기록 -->
  <section class="card list-card">
    <div class="card-head">
      <h2 class="card-title">오늘 먹은 기록</h2>
      <button id="resetBtn" type="button" class="link-btn">전체 삭제</button>
    </div>
    <ul id="list" class="meal-list"></ul>
  </section>

  <aside class="ad-card" aria-label="광고">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-9440982975556344"
         data-ad-slot="[슬롯번호]"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </aside>
</main>

<nav class="tab-bar" aria-label="메뉴">
  <a href="index.html" class="tab-item active"><span class="tab-icon">🏠</span>홈</a>
  <a href="search.html" class="tab-item"><span class="tab-icon">🔎</span>칼로리 체크</a>
  <a href="calendar.html" class="tab-item"><span class="tab-icon">📅</span>달력</a>
  <a href="foods.html" class="tab-item"><span class="tab-icon">🍚</span>음식 관리</a>
</nav>

<script src="js/store.js"></script>
<script src="js/home.js"></script>
</body>
</html>
